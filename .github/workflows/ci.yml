name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atacado
          POSTGRES_PASSWORD: atacado
          POSTGRES_DB: atacado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atacado -d atacado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atacado:atacado@127.0.0.1:5432/atacado_test
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      SCANNER_WORKER_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Scanner URL tests
        run: npm run test:scanner
      - name: Scanner collector tests
        run: npm run test:scanner:collector
      - name: Scanner normalizer tests
        run: npm run test:scanner:normalizer
      - name: Build
        run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/atacado-shop.log 2>&1 &
          echo $! > /tmp/atacado-shop.pid
      - name: Scanner module 1 integration
        run: node server/scanner-module1.integration.mjs
      - name: Scanner module 2 integration
        run: npm run test:scanner:module2
      - name: Scanner module 3 integration
        run: npm run test:scanner:module3
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/atacado-shop.log || true
