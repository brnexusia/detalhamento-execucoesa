name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atacado
          POSTGRES_PASSWORD: atacado
          POSTGRES_DB: atacado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atacado -d atacado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atacado:atacado@127.0.0.1:5432/atacado_test
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      SCANNER_WORKER_DISABLED: '1'
      SHOPVAX_PLAN_LIMITS_DISABLED: '1'
      SHOPVAX_SECURITY_RATE_LIMIT_DISABLED: '1'
      SHOPVAX_IMPORT_MEDIA_REPAIR_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Install PDF tooling for import regression tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng ffmpeg fonts-dejavu-core
      - name: Production dependency audit
        run: |
          test "$(node -p "require('./node_modules/multer/package.json').version")" = "2.5.0"
          npm audit --omit=dev --audit-level=moderate
      - name: Validate production Docker hooks
        run: |
          grep -Fq '"./server/brand-compat-hooks.mjs"' Dockerfile
          grep -Fq '"./server/security-hooks.mjs"' Dockerfile
          grep -Fq '"./server/stripe-billing-hooks.mjs"' Dockerfile
          grep -Fq '"./server/performance-hooks.mjs"' Dockerfile
          grep -Fq '"./server/api-json-hooks.mjs"' Dockerfile
          grep -Fq '"./server/phase5-launch-hooks.mjs"' Dockerfile
          grep -Fq 'phase5-launch-hooks.mjs' package.json
          grep -Fq '"./server/onboarding-growth-hooks.mjs"' Dockerfile
          grep -Fq 'onboarding-growth-hooks.mjs' package.json
          grep -Fq '"./server/analytics-features-hooks.mjs"' Dockerfile
          grep -Fq '"./server/team-features-hooks.mjs"' Dockerfile
          grep -Fq '"./server/commercial-config-hooks.mjs"' Dockerfile
          grep -Fq '"./server/catalog-order-lock-fix.mjs"' Dockerfile
          grep -Fq '"./server/catalog-features-hooks.mjs"' Dockerfile
          grep -Fq '"./server/business-features-hooks.mjs"' Dockerfile
          grep -Fq '"./server/platform-hooks.mjs"' Dockerfile
          grep -Fq '"./server/plan-limits-hooks.mjs"' Dockerfile
          grep -Fq '"./server/google-auth-hooks.mjs"' Dockerfile
          grep -Fq 'google-auth-hooks.mjs' package.json
          grep -Fq '"./server/scanner-hooks.mjs"' Dockerfile
          grep -Fq '"./server/scanner-publish-hooks.mjs"' Dockerfile
          grep -Fq '"./server/social-network-hooks.mjs"' Dockerfile
          grep -Fq '"./server/social-feed-ranking-hooks.mjs"' Dockerfile
          grep -Fq '"./server/social-commerce-hooks.mjs"' Dockerfile
          grep -Fq '"./server/social-analytics-hooks.mjs"' Dockerfile
          grep -Fq '"./server/public-protection-hooks.mjs"' Dockerfile
          grep -Fq '"./server/page-metadata-hooks.mjs"' Dockerfile
          grep -Eq 'href="/favicon\.svg(\?[^"]*)?"' index.html
          test -s public/favicon.svg
      - name: Validate official Shopvax identity assets
        run: |
          grep -Fq "import './shopvax-home.css'" src/main.tsx
          grep -Fq '#F25C05' public/favicon.svg
          ! grep -Eiq '#c8ff38' public/favicon.svg
          grep -Fq 'content="#161514"' index.html
      - name: Release smoke test (local, read-only)
        run: node --test tests/verify-production.test.mjs
      - name: Aprovacao dos planos comerciais e migracao segura
        run: node --test server/system-plans.test.mjs
      - name: Stripe billing policy and webhook verification
        run: |
          node --check server/stripe-billing-hooks.mjs
          npm run test:billing
      - name: Responsive media variants preserve originals
        run: node --test server/media-variants.test.mjs
      - name: Revisão de ergonomia - fontes, cursor e copy
        run: node --test tests/shopvax-ergonomics.test.mjs
      - name: Temas de loja e PDF por aparencia aplicada
        run: node --test server/shopvax-theme-presets.test.mjs
      - name: Scanner PDF catalog tests
        run: npm run test:scanner:pdf
      - name: Scanner URL tests
        run: npm run test:scanner
      - name: Google Photos and public image import tests
        run: npm run test:scanner:albums
      - name: Scanner collector tests
        run: npm run test:scanner:collector
      - name: Scanner normalizer tests
        run: npm run test:scanner:normalizer
      - name: Scanner review tests
        run: npm run test:scanner:review
      - name: Scanner import parent grouping tests
        run: node server/scanner-import-grouping.test.mjs
      - name: Scanner module 7 platform adapters
        run: node server/scanner-module7.test.mjs
      - name: Scanner module 7 dedicated collectors
        run: node server/scanner-module7-dedicated.test.mjs
      - name: Product polish regression checks
        run: npm run test:polish
      - name: Imported media localization regression checks
        run: node server/import-media-localizer.test.mjs
      - name: Google authentication regression checks
        run: npm run test:google-auth
      - name: Buyer WhatsApp authentication unit tests
        run: npm run test:buyer-whatsapp
      - name: Platform Google reauthentication regression checks
        run: node server/platform-google-reauth.test.mjs
      - name: Growth policy and consent privacy tests
        run: node --test server/onboarding-growth-policy.test.mjs
      - name: Growth hook JavaScript syntax
        run: node --check server/onboarding-growth-hooks.mjs
      - name: Build original product tour video (B02)
        run: node scripts/generate-shopvax-tour.mjs
      - name: Build
        run: npm run build
      - name: Show production bundles
        run: find dist/assets -maxdepth 1 -type f -printf '%f %k KB\n' | sort
      - name: Start application
        run: |
          npm start > /tmp/shopvax.log 2>&1 &
          echo $! > /tmp/shopvax.pid
      - name: Google auth disabled-by-default endpoint
        run: |
          node - <<'NODE'
          let response
          for (let attempt = 0; attempt < 40; attempt += 1) {
            try {
              response = await fetch('http://127.0.0.1:3000/api/public/auth/google-config')
              if (response.ok) break
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 250))
          }
          if (!response?.ok) throw new Error('Google config endpoint failed')
          const body = await response.json()
          if (body.enabled !== false || body.clientId !== null) throw new Error('Google auth should be disabled when GOOGLE_CLIENT_ID is absent')
          NODE
      - name: Stripe billing schema and fail-closed smoke test
        run: node server/stripe-billing.integration.mjs
      - name: Growth endpoints with real PostgreSQL (disabled external services)
        run: node server/onboarding-growth.integration.mjs
      - name: Admin compact/paged catalog multi-tenant integration
        run: node server/admin-pagination.integration.mjs
      - name: Social module 1 network foundation
        run: node server/social-module1.integration.mjs
      - name: Social module 2 public store profile
        run: node server/social-module2.integration.mjs
      - name: Social module 3 product publications
        run: node server/social-module3.integration.mjs
      - name: Social module 4 global infinite feed
        run: node server/social-module4.integration.mjs
      - name: Social module 5 interactions
        run: node server/social-module5.integration.mjs
      - name: Social module 6 ask to WhatsApp
        run: node server/social-module6.integration.mjs
      - name: Social module 7 plan priority
        run: node server/social-module7.integration.mjs
      - name: Social module 8 store diversity
        run: node server/social-module8.integration.mjs
      - name: Social module 9 public navigation
        run: node server/social-module9.integration.mjs
      - name: Social module 10 social metrics
        run: node server/social-module10.integration.mjs
      - name: Social module 11 feed behavior
        run: node server/social-module11.integration.mjs
      - name: Social module 12 post to product
        run: node server/social-module12.integration.mjs
      - name: Social module 13 seller continuity
        run: node server/social-module13.integration.mjs
      - name: Social module 14 cart isolation
        run: node server/social-module14.integration.mjs
      - name: Social module 15 Shopvax base rebrand
        run: node server/social-module15.integration.mjs
      - name: Social module 16 Shopvax surfaces rebrand
        run: node server/social-module16.integration.mjs
      - name: Social module 17 deep-link metadata
        run: node server/social-module17.integration.mjs
      - name: Social module 18 brand compatibility
        run: node server/social-module18.integration.mjs
      - name: Business module 2 stock integration
        run: node server/business-module2.integration.mjs
      - name: Business module 3 catalogs integration
        run: node server/business-module3.integration.mjs
      - name: Business module 4 intelligence integration
        run: node server/business-module4.integration.mjs
      - name: Business module 5 team integration
        run: node server/business-module5.integration.mjs
      - name: Business module 6 commercial info integration
        run: node server/business-module6.integration.mjs
      - name: Scanner module 1 integration
        run: node server/scanner-module1.integration.mjs
      - name: Scanner module 2 integration
        run: npm run test:scanner:module2
      - name: PDF catalog upload-to-publish integration
        run: node server/scanner-pdf.integration.mjs
      - name: Scanner module 3 integration
        run: npm run test:scanner:module3
      - name: Scanner module 4 integration
        run: npm run test:scanner:module4
      - name: Scanner module 5 integration
        run: npm run test:scanner:module5
      - name: Scanner parent product integration
        run: node server/scanner-parent-product.integration.mjs
      - name: Scanner 50k full pipeline
        run: node server/scanner-scale.integration.mjs
      - name: Scanner module 6 integration
        run: npm run test:scanner:module6
      - name: Start secure launch profile
        env:
          PORT: 3001
          BASE_URL: http://127.0.0.1:3001
          SHOPVAX_PLAN_LIMITS_DISABLED: '0'
          SHOPVAX_SECURITY_RATE_LIMIT_DISABLED: '0'
        run: |
          npm start > /tmp/shopvax-secure.log 2>&1 &
          echo $! > /tmp/shopvax-secure.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/shopvax-secure.log
          exit 1
      - name: Platform admin and launch security integration
        env:
          BASE_URL: http://127.0.0.1:3001
          SHOPVAX_PLAN_LIMITS_DISABLED: '0'
          SHOPVAX_SECURITY_RATE_LIMIT_DISABLED: '0'
        run: node server/platform-admin.integration.mjs
      - name: Print server log on failure
        if: failure()
        run: |
          cat /tmp/shopvax.log || true
          cat /tmp/shopvax-secure.log || true
