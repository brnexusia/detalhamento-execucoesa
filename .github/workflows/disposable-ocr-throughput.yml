name: TEMP disposable actual OCR throughput
on:
  push:
    branches: [lab/disposable-k6-2k-shopvax-20261115]
    paths:
      - 'scripts/temp-ocr-benchmark.mjs'
      - '.github/workflows/disposable-ocr-throughput.yml'
permissions:
  contents: read
jobs:
  ocr-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SHOPVAX_PERF_LOCAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por tesseract-ocr-eng util-linux
      - run: npm install --no-audit --no-fund
      - name: OCR actual images in groups of 4, 12 and 24 simultaneous processes
        run: node scripts/temp-ocr-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-shopvax-ocr-throughput
          path: /tmp/shopvax-ocr-throughput.json
          retention-days: 7
          if-no-files-found: warn
