name: apply-cristaluxe-fix
on:
  push:
    branches: [scanner-complete-custom-sites]
    paths:
      - '.github/workflows/apply-cristaluxe-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-complete-custom-sites
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/apply-cristaluxe-fix.py
      - run: npm install
      - run: node server/scanner-module7.test.mjs
      - run: npm run test:scanner:normalizer
      - run: npm run build
      - name: Commit production patch
        run: |
          rm -f .github/scripts/research-cristaluxe.mjs
          rm -f .github/workflows/research-cristaluxe.yml
          rm -f .github/scripts/apply-cristaluxe-fix.py
          rm -f .github/workflows/apply-cristaluxe-fix.yml
          git config user.name brnexusia
          git config user.email brnexusia@gmail.com
          git add -A
          git commit -m "Scanner: suportar vitrines FacilZap modernas" || exit 0
          git push origin HEAD:scanner-complete-custom-sites
