name: apply-discard-import-branch
on:
  push:
    branches: [feature-discard-imports]
    paths:
      - '.github/workflows/apply-discard-import-branch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atacado
          POSTGRES_PASSWORD: atacado
          POSTGRES_DB: atacado_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atacado -d atacado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atacado:atacado@127.0.0.1:5432/atacado_test
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      SCANNER_WORKER_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-discard-imports
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/add-discard-import.py
      - run: npm install
      - run: npm run build
      - name: Start app
        run: |
          npm start >/tmp/atacado.log 2>&1 &
          sleep 2
      - run: node server/scanner-discard.integration.mjs
      - name: Commit production files
        run: |
          git config user.name "brnexusia"
          git config user.email "brnexusia@gmail.com"
          git add server/scanner-hooks.mjs server/scanner-discard.integration.mjs src/api.ts src/ScannerModule1.tsx src/scanner-module1.css
          git commit -m "Scanner: descartar importações e limpar dados temporários"
          git push origin HEAD:feature-discard-imports
