name: diagnose-mama-final-four
on:
  push:
    branches: [test/mama-final-four-ocr-20261114]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por tesseract-ocr-eng util-linux
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: node scripts/diagnose-mama-final-four.mjs
