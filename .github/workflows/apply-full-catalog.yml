name: export-full-catalog-clean

on:
  push:
    branches: [scanner-full-catalog]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-full-catalog
          fetch-depth: 0
      - name: Export production files to clean branch
        run: |
          git fetch origin scanner-full-catalog-clean scanner-full-catalog
          git checkout -B scanner-full-catalog-clean origin/scanner-full-catalog-clean
          git checkout origin/scanner-full-catalog -- \
            server/scanner-collector.mjs \
            server/scanner-hooks.mjs \
            server/scanner-publish-hooks.mjs \
            server/scanner-collector.test.mjs \
            server/scanner-scale.integration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/scanner-collector.mjs server/scanner-hooks.mjs server/scanner-publish-hooks.mjs server/scanner-collector.test.mjs server/scanner-scale.integration.mjs
          git commit -m "Scanner: catálogo completo sem teto"
          git push origin HEAD:scanner-full-catalog-clean
