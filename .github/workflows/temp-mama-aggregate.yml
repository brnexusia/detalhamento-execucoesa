name: TEMP MAMA aggregate every OCR result and validate coverage
on:
  push:
    branches: [audit/mama-all-photos-ocr-20261116]
    paths:
      - 'scripts/temp-mama-aggregate.mjs'
      - '.github/workflows/temp-mama-aggregate.yml'
permissions:
  contents: read
  actions: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect all 84 completed baseline shards from the first exhaustive run
        run: |
          for n in $(seq 1 135); do
            ARTIFACTS=$(gh api --paginate "repos/$GH_REPO/actions/runs/43803320353/artifacts?per_page=100" --jq '.artifacts[].name' | grep -c '^mama-audit-' || true)
            echo "MAMA_AGG_WAIT baseline artifacts=$ARTIFACTS/84"
            if [ "$ARTIFACTS" -ge 84 ]; then break; fi
            sleep 15
          done
          test "$ARTIFACTS" -eq 84
          mkdir -p /tmp/mama-data
          gh run download 43803320353 --repo "$GH_REPO" --dir /tmp/mama-data
      - name: Validate 3980-photo coverage and merge missing-price reports
        run: node scripts/temp-mama-aggregate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mama-all-photo-baseline
          path: /tmp/mama-audit-aggregate/baseline.json
          retention-days: 7
          if-no-files-found: warn
