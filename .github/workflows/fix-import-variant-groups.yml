name: fix-import-variant-groups
on:
  push:
    branches: [fix-import-images-variant-groups]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-import-images-variant-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python .github/scripts/run-fix-variant-import.py
      - run: npm install
      - name: Normalizer regression
        run: npm run test:scanner:normalizer
      - name: Collector regression
        run: npm run test:scanner:collector
      - name: Build
        run: npm run build
      - name: Commit clean branch
        shell: bash
        run: |
          git rm .github/workflows/fix-import-variant-groups.yml .github/scripts/fix-variant-import.py .github/scripts/run-fix-variant-import.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/scanner-normalizer.mjs server/scanner-normalizer.test.mjs server/scanner-hooks.mjs server/scanner-variant-grouping.integration.mjs .github/workflows/ci.yml
          git commit -m "Fix scanner image and variant grouping"
          git push origin HEAD:fix-import-images-variant-groups
