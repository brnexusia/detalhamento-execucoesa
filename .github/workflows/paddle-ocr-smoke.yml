name: paddle-ocr-inline-smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/scanner-pdf-paddle.mjs'
      - 'server/scanner-pdf-paddle.test.mjs'
      - 'server/paddle-ocr-service.py'
      - 'server/scanner-pdf.mjs'
      - 'server/scanner-pdf-spatial.mjs'
      - 'server/scanner-pdf-spatial.test.mjs'
      - 'server/scanner-pdf-spatial.integration.test.mjs'
      - 'Dockerfile'
      - 'scripts/start-with-paddle-ocr.sh'
      - '.github/workflows/paddle-ocr-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'server/scanner-pdf-paddle.mjs'
      - 'server/scanner-pdf-paddle.test.mjs'
      - 'server/paddle-ocr-service.py'
      - 'server/scanner-pdf.mjs'
      - 'server/scanner-pdf-spatial.mjs'
      - 'server/scanner-pdf-spatial.test.mjs'
      - 'server/scanner-pdf-spatial.integration.test.mjs'
      - 'Dockerfile'
      - 'scripts/start-with-paddle-ocr.sh'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check server/scanner-pdf-paddle.mjs
          node --check server/scanner-pdf.mjs
          node --check server/scanner-pdf-spatial.mjs
      - name: Validate Python syntax
        run: python3 -m py_compile server/paddle-ocr-service.py
      - name: Install scanner integration test dependencies
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils util-linux
      - name: PaddleOCR bridge and spatial unit tests
        run: node --test server/scanner-pdf-paddle.test.mjs server/scanner-pdf-spatial.test.mjs
      - name: OCR geometry through a real scanned PDF pipeline
        run: node --test server/scanner-pdf-spatial.integration.test.mjs
      - name: Ensure single container integration
        run: |
          grep -Fq 'python3 -m venv /opt/paddleocr' Dockerfile
          grep -Fq 'start-with-paddle-ocr.sh' Dockerfile
          grep -Fq '127.0.0.1' server/paddle-ocr-service.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build application and PaddleOCR in the same Docker image
        run: docker build --file Dockerfile --tag atacado-paddleocr-smoke .
      - name: Verify PaddleOCR Python runtime and cached models
        run: |
          docker run --rm --entrypoint /opt/paddleocr/bin/python atacado-paddleocr-smoke -c 'from paddleocr import PaddleOCR; print("paddleocr-ready")'
