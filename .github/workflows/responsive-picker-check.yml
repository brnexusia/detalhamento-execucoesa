name: responsive-picker-check

on:
  pull_request:
    paths:
      - 'src/PublicStoreV2.tsx'
      - 'src/responsive-media.ts'
      - 'tests/shopvax-responsive-media.e2e.mjs'
      - 'src/api.ts'
      - 'tests/shopvax-network-recovery.e2e.mjs'
      - 'src/product-picker-responsive.css'
      - 'src/shopvax-desktop-product-page.css'
      - 'src/shopvax-desktop-ticket-05.css'
      - 'tests/shopvax-desktop-ticket-05.e2e.mjs'
      - 'tests/shopvax-desktop-product-05.e2e.mjs'
      - 'src/canvas.css'
      - 'src/saas.css'
      - 'src/product-gallery.css'
      - 'src/styles.css'
      - 'src/main.tsx'
      - 'src/Home.tsx'
      - 'src/HomeRoute.tsx'
      - 'src/shopvax-home.css'
      - 'src/Auth.tsx'
      - 'src/shopvax-panel-login-06.css'
      - 'public/redesign/shopvax-panel-mosaic.webp'
      - 'tests/shopvax-panel-06.e2e.mjs'
      - 'src/AuthRoute.tsx'
      - 'src/shopvax-auth-official.css'
      - 'src/shopvax-cross-surface.css'
      - 'src/SocialFeed.tsx'
      - 'src/SocialStoreProfile.tsx'
      - 'src/social-feed.css'
      - 'src/social-profile.css'
      - 'src/shopvax-social-official.css'
      - 'src/shopvax-brand-assets.css'
      - 'public/brand/**'
      - 'public/favicon.svg'
      - 'tests/shopvax-official-brand.e2e.mjs'
      - 'src/shopvax-social-feed-layout.css'
      - 'src/shopvax-store-layout-fixes.css'
      - 'src/PublicRoute.tsx'
      - 'src/StoreSocialNav.tsx'
      - 'src/CustomerAccountLauncher.tsx'
      - 'tests/shopvax-layout-repairs.e2e.mjs'
      - 'tests/shopvax-viewport-fit.e2e.mjs'
      - 'src/CustomerAccountRoute.tsx'
      - 'src/customer-account.css'
      - 'tests/shopvax-surface-redesign.e2e.mjs'
      - 'public/favicon.svg'
      - 'index.html'
      - 'tests/shopvax-home-brand.e2e.mjs'
      - 'tests/product-picker-responsive.e2e.mjs'
      - 'tests/brand-phase1.e2e.mjs'
      - 'tests/shopvax-grade.e2e.mjs'
      - 'tests/shopvax-multiniche-04.e2e.mjs'
      - 'tests/shopvax-feed.e2e.mjs'
      - 'tests/shopvax-checkout-review.e2e.mjs'
      - 'tests/shopvax-mobile-flow-03.e2e.mjs'
      - 'tests/shopvax-plans.e2e.mjs'
      - 'tests/shopvax-product-list.e2e.mjs'
      - 'tests/shopvax-order-buyer.e2e.mjs'
      - 'tests/shopvax-catalog-sort.e2e.mjs'
      - 'tests/shopvax-final-responsive.e2e.mjs'
      - 'src/shopvax-final-motion.css'
      - 'src/ShopvaxOrderReady.tsx'
      - 'tests/shopvax-motion-eight.e2e.mjs'
      - 'src/shopvax-product-operations.css'
      - 'src/ShopvaxPlans.tsx'
      - 'src/ShopvaxFirstRun.tsx'
      - 'src/shopvax-plans.css'
      - 'src/shopvax-onboarding.css'
      - 'src/ShopvaxCheckoutReview.tsx'
      - 'src/shopvax-feed-redesign.css'
      - 'src/ShopvaxGrade.tsx'
      - 'src/ShopvaxDashboard.tsx'
      - 'src/shopvax-commerce.css'
      - 'src/shopvax-dashboard.css'
      - 'src/shopvax-brand.css'
      - 'src/ShopvaxDesignSystem.tsx'
      - '.github/workflows/responsive-picker-check.yml'
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.58.2
      - run: npx playwright install chromium
      - run: npm run build
      - name: Serve the application
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 80); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Browser regression across viewport sizes
        run: node tests/product-picker-responsive.e2e.mjs
      - name: Fotos locais responsivas sem quebrar URLs externas
        run: node tests/shopvax-responsive-media.e2e.mjs
      - name: Official design layer 05 - desktop product as a page, related products and mobile modal
        run: node tests/shopvax-desktop-product-05.e2e.mjs
      - name: Official design layer 05 - desktop cart ticket always visible
        run: node tests/shopvax-desktop-ticket-05.e2e.mjs
      - name: Shopvax institutional identity across viewports
        run: node tests/shopvax-home-brand.e2e.mjs
      - name: Official redesign for login, signup, social feed, profile and onboarding
        run: node tests/shopvax-surface-redesign.e2e.mjs
      - name: Layer 06 panel login photo mosaic and responsive overlay
        run: node tests/shopvax-panel-06.e2e.mjs
      - name: Official vector brand, wordmark and favicon on live DOM
        run: node tests/shopvax-official-brand.e2e.mjs
      - name: Mobile header and desktop feed layout regression
        run: node tests/shopvax-layout-repairs.e2e.mjs
      - name: Full viewport login and feed at normal and increased browser zoom
        run: node tests/shopvax-viewport-fit.e2e.mjs
      - name: Brand foundation regression across stores
        run: node tests/brand-phase1.e2e.mjs
      - name: Wholesale grade browser regression
        run: node tests/shopvax-grade.e2e.mjs
      - name: Official layer 04 - fashion, cosmetics and home product attributes
        run: node tests/shopvax-multiniche-04.e2e.mjs
      - name: Feed interaction browser regression
        run: node tests/shopvax-feed.e2e.mjs
      - name: Checkout review browser regression
        run: node tests/shopvax-checkout-review.e2e.mjs
      - name: Layer 03 - mobile catalogue, minimum, review and WhatsApp handoff
        run: node tests/shopvax-mobile-flow-03.e2e.mjs
      - name: Resiliência de rede - erro recuperável e busca sem respostas obsoletas
        run: node tests/shopvax-network-recovery.e2e.mjs
      - name: Plans layout and navigation regression
        run: node tests/shopvax-plans.e2e.mjs
      - name: Product list browser regression
        run: node tests/shopvax-product-list.e2e.mjs
      - name: Order buyer details browser regression
        run: node tests/shopvax-order-buyer.e2e.mjs
      - name: Global catalogue sorting browser regression
        run: node tests/shopvax-catalog-sort.e2e.mjs
      - name: Final responsive and reduced-motion acceptance
        run: node tests/shopvax-final-responsive.e2e.mjs
      - name: Official motion 08 - ribbon, stamp, quantity, minimum, receipt and reduced-motion
        run: node tests/shopvax-motion-eight.e2e.mjs
      - name: Visual evidence from final responsive acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopvax-redesign-visual-evidence
          path: artifacts/shopvax-redesign/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Debug log
        if: failure()
        run: cat /tmp/vite.log || true
