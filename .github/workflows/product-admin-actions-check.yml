name: product-admin-actions-check

on:
  push:
    branches: [fix/import-text-bulk-delete-products-pdf]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atacado
          POSTGRES_PASSWORD: atacado
          POSTGRES_DB: atacado_product_actions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atacado -d atacado_product_actions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atacado:atacado@127.0.0.1:5432/atacado_product_actions
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      SCANNER_WORKER_DISABLED: '1'
      SHOPVAX_SECURITY_RATE_LIMIT_DISABLED: '1'
      SHOPVAX_IMPORT_MEDIA_REPAIR_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Scanner normalizer
        run: npm run test:scanner:normalizer
      - name: Scanner review
        run: npm run test:scanner:review
      - name: Build
        run: npm run build
      - name: Start app
        run: |
          npm start > /tmp/shopvax-product-actions.log 2>&1 &
          for i in {1..160}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/shopvax-product-actions.log
          exit 1
      - name: Product actions integration
        run: node server/business-module3.integration.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/shopvax-product-actions.log || true
