name: braavo-quality-check

on:
  push:
    branches: [fix/braavo-image-quality-and-ratio]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Import media localizer
        run: node server/import-media-localizer.test.mjs
      - name: Scanner collector
        run: npm run test:scanner:collector
      - name: Build
        run: npm run build
