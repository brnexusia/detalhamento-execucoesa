name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FacilZap public component
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://assets-cdn.facilzap.app.br/componentes/catalogo/listagem-catalogo/listagem-catalogo.1.0.1.js' -o /tmp/listagem.js
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/listagem.js').read_text(errors='ignore')
          print('JS_BYTES',len(t))
          for term in ('urlCarregarProdutosTemplate','carregarMaisProdutos','fetch(', 'axios', 'paginaAtual', 'searchId'):
              for m in list(re.finditer(re.escape(term),t,re.I))[:4]:
                  print('\nTERM',term,'\n',t[max(0,m.start()-700):m.start()+2800][:3500])
          PY
