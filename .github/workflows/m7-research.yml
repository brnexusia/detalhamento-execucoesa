name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current Vesti product showcase
        shell: bash
        run: |
          set -euo pipefail
          LIST='https://apivesti.vesti.mobi/appmarca/v2/catalogue/5e66ad229f3f6fe/company/barracadowillinha/?page=1&perpage=1&with_categories=true&with_colors=true&with_product_colors=true&with_sizes=true&with_brands=true&with_prices=true&with_tags=1'
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' "$LIST" -o /tmp/list.json
          python - <<'PY' > /tmp/vars
          import json,re
          from pathlib import Path
          d=json.loads(Path('/tmp/list.json').read_text()); p=d['products'][0]
          media=json.dumps(p.get('media',{}))
          m=re.search(r'cdn-op\.vesti\.mobi/p/(\d+)/',media)
          print(p['id']); print(m.group(1) if m else '')
          PY
          PRODUCT_ID=$(sed -n '1p' /tmp/vars)
          COMPANY_ID=$(sed -n '2p' /tmp/vars)
          echo "PRODUCT_ID=$PRODUCT_ID COMPANY_ID=$COMPANY_ID"
          URL="https://apivesti.vesti.mobi/appmarca/v1/products/company/${COMPANY_ID}/product/${PRODUCT_ID}/showcase?cid=5e66ad229f3f6fe&reseller_id=null"
          CODE=$(curl -sSL --max-time 20 -A 'Mozilla/5.0' -o /tmp/detail.json -w '%{http_code}' "$URL")
          echo "DETAIL_HTTP=$CODE BYTES=$(wc -c < /tmp/detail.json)"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/detail.json').read_text())
          print('TOP_KEYS',sorted(d.keys()))
          pg=d.get('product_group') or d.get('product') or d
          print('TYPE',type(pg).__name__)
          if isinstance(pg,dict):
              print('GROUP_KEYS',sorted(pg.keys()))
              for k in ('id','code','name','description','media','colors','sizes','stocks','skus','prices','negotiations','variants'):
                  if k in pg:
                      print(k,json.dumps(pg[k],ensure_ascii=False)[:12000])
          PY
