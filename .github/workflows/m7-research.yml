name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect variant payloads on real product pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request,html as htmlmod
          UA={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          def get(url):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=20) as r:
              return r.read(5_000_000).decode('utf-8','ignore'),r.url
          def locs(body):
            return [htmlmod.unescape(x.strip()) for x in re.findall(r'<loc[^>]*>(.*?)</loc>',body,re.I|re.S)]

          # Nuvemshop: use first real /produtos/ URL from sitemap.
          root='https://tecnoloja14.lojavirtualnuvem.com.br/'
          sitemap,_=get(root+'sitemap.xml')
          nuvem=[u for u in locs(sitemap) if re.search(r'/produtos/[^/]+/?$',u,re.I)]
          print('NUVEM_PRODUCT_COUNT',len(nuvem),'FIRST',nuvem[0] if nuvem else '')
          if nuvem:
            body,final=get(nuvem[0]); print('NUVEM_BYTES',len(body),'FINAL',final)
            terms=['productVariants','variants','variant','sku','attributes','data-product','LS.product','window.LS','selectedVariant','product_variants','product-variants']
            for term in terms:
              matches=list(re.finditer(re.escape(term),body,re.I)); print('NUVEM_TERM',term,'COUNT',len(matches))
              for m in matches[:2]:
                snippet=body[max(0,m.start()-700):m.start()+2800]
                print('NUVEM_CTX',term,snippet[:3500].replace('\n',' ')[:3500])
            for idx,script in enumerate(re.findall(r'<script[^>]*>([\s\S]*?)</script>',body,re.I)):
              if re.search(r'variant|sku|productVariants|data-product',script,re.I) and len(script)<250000:
                print('NUVEM_SCRIPT',idx,'LEN',len(script),script[:12000].replace('\n',' '))

          # Loja Integrada: resolve product sitemap and inspect first product page.
          root='https://cn-demo-6.lojaintegrada.com.br/'
          sm,_=get(root+'sitemap.xml')
          indexes=[u for u in locs(sm) if re.search(r'/sitemap/product-[^/]*\.xml',u,re.I)]
          print('LI_PRODUCT_SITEMAPS',indexes)
          if indexes:
            prodsm,_=get(indexes[0]); products=locs(prodsm); print('LI_PRODUCT_COUNT',len(products),'FIRST',products[0] if products else '')
            if products:
              body,final=get(products[0]); print('LI_BYTES',len(body),'FINAL',final)
              terms=['variacao','variação','variant','sku','atributo','attribute','data-product','grade','opcao','opção','estoque']
              for term in terms:
                matches=list(re.finditer(re.escape(term),body,re.I)); print('LI_TERM',term,'COUNT',len(matches))
                for m in matches[:2]:
                  snippet=body[max(0,m.start()-700):m.start()+2800]
                  print('LI_CTX',term,snippet[:3500].replace('\n',' ')[:3500])
              for idx,script in enumerate(re.findall(r'<script[^>]*>([\s\S]*?)</script>',body,re.I)):
                if re.search(r'variacao|variant|sku|atributo|grade',script,re.I) and len(script)<250000:
                  print('LI_SCRIPT',idx,'LEN',len(script),script[:12000].replace('\n',' '))
          PY
