name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe valid Tray demos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request,urllib.error
          targets=[
            'https://demo-go-beauty.commercesuite.com.br/',
            'https://demo-autoparts-store.commercesuite.com.br/',
            'https://lojatestesizebay.commercesuite.com.br/',
            'https://750831.commercesuite.com.br/loja/busca.php?loja=750831',
          ]
          for root in targets:
            print('\nROOT',root)
            for suffix in ('','sitemap.xml','web_api/products?limit=100&page=1'):
              url=root if not suffix else urllib.parse.urljoin(root,suffix)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html,application/xml;q=0.9,*/*;q=0.8'})
              try:
                with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read(2_000_000).decode('utf-8','ignore')
                  print('PROBE',url,'HTTP',r.status,'TYPE',r.headers.get('content-type'),'BYTES',len(body),'FINAL',r.url)
              except urllib.error.HTTPError as e:
                body=e.read(100000).decode('utf-8','ignore'); print('PROBE',url,'HTTP',e.code,'TYPE',e.headers.get('content-type'),'BYTES',len(body)); continue
              except Exception as e:
                print('PROBE',url,'ERROR',type(e).__name__,str(e)); continue
              if 'web_api' in url:
                try:
                  data=json.loads(body); print('JSON_KEYS',list(data)[:15]);
                  for k in ('Products','products','paging','Paging'):
                    if k in data: print(k,'LEN',len(data[k]) if hasattr(data[k],'__len__') else '-',json.dumps(data[k],ensure_ascii=False)[:3000])
                except: print('NOT_JSON',body[:500])
              elif 'sitemap' in url:
                locs=re.findall(r'<loc[^>]*>(.*?)</loc>',body,re.I|re.S); print('SITEMAP_LOCS',len(locs),'SAMPLE',locs[:10])
              else:
                links=re.findall(r'href=["\']([^"\']+)',body,re.I)
                product_links=[x for x in links if re.search(r'produto|product|pro=[0-9]+|/p/',x,re.I)]
                print('PRODUCT_LINKS',len(product_links),'SAMPLE',product_links[:10])
                m=re.search(r'(\d+)\s+produtos encontrados',body,re.I); print('COUNT_TEXT',m.group(1) if m else '')
          PY
