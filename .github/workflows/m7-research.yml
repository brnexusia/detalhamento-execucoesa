name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Vesti product request contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' 'https://vesti.co/barracadowillinha/catalogo/5e66ad229f3f6fe' -o /tmp/root.html
          python - <<'PY' > /tmp/scripts.txt
          import re
          from pathlib import Path
          t=Path('/tmp/root.html').read_text(errors='ignore')
          for src in dict.fromkeys(re.findall(r'<script[^>]+src="([^"]+\.js)"',t,re.I)):
              print('https://vesti.co'+src if src.startswith('/') else src)
          PY
          mkdir -p /tmp/js
          n=0
          while IFS= read -r URL; do n=$((n+1)); curl -fsSL --max-time 20 "$URL" -o "/tmp/js/$n.js" || true; done < /tmp/scripts.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text='\n'.join(p.read_text(errors='ignore') for p in Path('/tmp/js').glob('*.js'))
          for needle in ('11414:function','fetchProducts:async','34032:function'):
              m=re.search(re.escape(needle),text)
              print('\n###',needle,'###')
              print(text[m.start():m.start()+12000] if m else 'NOT FOUND')
          PY
