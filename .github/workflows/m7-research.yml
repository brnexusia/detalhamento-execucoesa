name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vesti query pagination
        shell: bash
        run: |
          set -euo pipefail
          for PAGE in 1 2 3 10; do
            URL="https://vesti.co/barracadowillinha/catalogo/5e66ad229f3f6fe?page=${PAGE}"
            curl -fsSL --max-time 20 -A 'Mozilla/5.0' "$URL" -o "/tmp/v${PAGE}.html"
            python - "$PAGE" <<'PY'
          from pathlib import Path
          import re,sys,hashlib
          p=sys.argv[1]; t=Path('/tmp/v'+p+'.html').read_text(errors='ignore')
          print('PAGE',p,'BYTES',len(t),'SHA',hashlib.sha1(t.encode()).hexdigest()[:12])
          print('PRODUCT_CDN',len(re.findall(r'cdn-op\.vesti\.mobi/p/',t)))
          for term in ('\\"page\\":'+p,'\\"currentPage\\":'+p,'\\"slug\\"','\\"price\\"','\\"id\\"'):
            print(term,len(re.findall(re.escape(term),t)))
          for m in list(re.finditer(r'cdn-op\.vesti\.mobi/p/',t))[:1]: print(t[max(0,m.start()-1500):m.start()+3500][:5000])
          PY
          done
