name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vesti product showcase
        shell: bash
        run: |
          set -euo pipefail
          URL='https://apivesti.vesti.mobi/appmarca/v1/products/company/707072/product/8f1bff00-39b9-4917-9a96-8e2325df9ab4/showcase?cid=5e66ad229f3f6fe&reseller_id=null'
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' "$URL" -o /tmp/detail.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/detail.json').read_text())
          print('TOP_KEYS',sorted(data.keys()))
          pg=data.get('product_group') or data.get('product') or data
          print('GROUP_KEYS',sorted(pg.keys()) if isinstance(pg,dict) else type(pg).__name__)
          if isinstance(pg,dict):
              keep={k:pg.get(k) for k in ('id','code','name','description','media','colors','sizes','stocks','skus','prices','negotiations') if k in pg}
              print(json.dumps(keep,ensure_ascii=False)[:30000])
          PY
