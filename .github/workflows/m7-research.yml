name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Find Loja Integrada products with variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,urllib.request,html as htmlmod,json
          UA={'User-Agent':'Mozilla/5.0'}
          def get(url):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=20) as r: return r.read(5_000_000).decode('utf-8','ignore')
          def locs(body): return [htmlmod.unescape(x.strip()) for x in re.findall(r'<loc[^>]*>(.*?)</loc>',body,re.I|re.S)]
          root='https://cn-demo-6.lojaintegrada.com.br/'
          index=get(root+'sitemap.xml')
          product_sitemaps=[u for u in locs(index) if re.search(r'/sitemap/product-[^/]*\.xml',u,re.I)]
          urls=[]
          for sm in product_sitemaps: urls += locs(get(sm))
          print('PRODUCTS',len(urls))
          found=0
          for i,url in enumerate(urls):
            body=get(url)
            vm=re.search(r'var\s+variacoes\s*=\s*([^;]+);',body,re.I)
            gm=re.search(r'var\s+grades\s*=\s*([^;]+);',body,re.I)
            v=(vm.group(1).strip() if vm else '')
            g=(gm.group(1).strip() if gm else '')
            has=bool(v and v.lower() not in ('undefined','null','{}','[]')) or bool(g and g.lower() not in ('undefined','null','{}','[]'))
            attrs=len(re.findall(r'class=["\'][^"\']*atributo-item',body,re.I))
            data_variations=len(re.findall(r'data-variacao-(?:id|nome)=',body,re.I))
            print('LI_PAGE',i+1,'HAS',has,'ATTRS',attrs,'DATA_VARIATIONS',data_variations,'URL',url)
            if has or attrs or data_variations:
              found+=1
              print('VARIACOES',v[:12000])
              print('GRADES',g[:12000])
              for m in list(re.finditer(r'atributo-item',body,re.I))[:3]: print('CTX',body[max(0,m.start()-1200):m.start()+5000][:6200].replace('\n',' '))
          print('FOUND_WITH_VARIANT_SIGNALS',found)
          PY
