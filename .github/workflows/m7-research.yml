name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public pagination
        shell: bash
        run: |
          set -euo pipefail
          for PAGE in 0 1 2 20 30; do
            URL="https://facilzap.app.br/yeshuaperfumaria/carregar_produtos/${PAGE}/0/92993271499"
            CODE=$(curl -sSL --max-time 20 -A 'Mozilla/5.0' -o "/tmp/fz-${PAGE}" -w '%{http_code}' "$URL")
            echo "FZ PAGE=$PAGE HTTP=$CODE BYTES=$(wc -c < /tmp/fz-${PAGE})"
            head -c 1200 "/tmp/fz-${PAGE}"; echo
          done
          for PAGE in 1 2 3; do
            URL="https://vesti.co/barracadowillinha/catalogo/5e66ad229f3f6fe/f/page/${PAGE}"
            CODE=$(curl -sSL --max-time 20 -A 'Mozilla/5.0' -o "/tmp/v-${PAGE}" -w '%{http_code}' "$URL")
            echo "VESTI PAGE=$PAGE HTTP=$CODE BYTES=$(wc -c < /tmp/v-${PAGE})"
            python - "$PAGE" <<'PY'
          from pathlib import Path
          import re,sys
          page=sys.argv[1]
          t=Path('/tmp/v-'+page).read_text(errors='ignore')
          for pattern in [r'\\"products\\"', r'\\"total\\"', r'\\"last_page\\"', r'\\"current_page\\"', r'\\"name\\":\\"', r'/produto/']:
              print(pattern, len(re.findall(pattern,t,re.I)))
          for term in ('\\"products\\"','\\"pagination\\"','\\"meta\\"'):
              i=t.find(term)
              if i>=0: print(t[max(0,i-300):i+2200][:2500])
          PY
          done
