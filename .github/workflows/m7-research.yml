name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-module7-platforms-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Real storefront smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { collectCatalog } from './server/scanner-collector.mjs'

          const targets = [
            ['nuvemshop', 'https://tecnoloja14.lojavirtualnuvem.com.br/'],
            ['lojaintegrada', 'https://cn-demo-6.lojaintegrada.com.br/'],
            ['tray', 'https://demo-go-beauty.commercesuite.com.br/'],
            ['vesti', 'https://vesti.co/barracadowillinha/catalogo/5e66ad229f3f6fe'],
          ]

          for (const [expected, url] of targets) {
            const started = Date.now()
            const result = await collectCatalog(url, {
              maxProducts: 1000,
              maxPages: 5000,
              strictPlatformAdapters: true,
            })
            const totalVariants = result.candidates.reduce((sum, p) => sum + (p.variants?.length || 0), 0)
            const sampleWithVariants = result.candidates.find((p) => p.variants?.length)
            console.log('REAL_FINAL', JSON.stringify({
              expected,
              detected: result.platform,
              count: result.candidateCount,
              pages: result.pagesScanned,
              ms: Date.now() - started,
              totalVariants,
              sample: result.candidates.slice(0, 2).map((p) => ({ title: p.title, sku: p.sku, price: p.price, images: p.images?.length || 0, variants: p.variants?.length || 0, properties: p.properties?.map((x) => x.name), source: p.source })),
              variantSample: sampleWithVariants ? { title: sampleWithVariants.title, variants: sampleWithVariants.variants.slice(0, 3) } : null,
            }))
            assert.equal(result.platform, expected)
            assert.ok(result.candidateCount > 0)
            if (expected === 'nuvemshop') assert.ok(result.pagesScanned < 150, `Nuvemshop pages=${result.pagesScanned}`)
            if (expected === 'lojaintegrada') assert.ok(result.pagesScanned < 150, `Loja Integrada pages=${result.pagesScanned}`)
            if (expected === 'tray') {
              assert.ok(result.candidateCount >= 50)
              assert.ok(totalVariants > 0, 'Tray sem variantes públicas agregadas')
            }
            if (expected === 'vesti') {
              assert.ok(result.candidateCount >= 150)
              assert.ok(totalVariants > 0, 'Vesti sem grade detalhada')
              assert.ok(result.candidates.some((p) => p.properties?.some((x) => x.name === 'Tamanho')), 'Vesti sem tamanhos')
            }
          }
          NODE
