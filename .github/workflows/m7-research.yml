name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public storefronts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' 'https://facilzap.app.br/yeshuaperfumaria' -o /tmp/fz.html
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' 'https://vesti.co/barracadowillinha/catalogo/5e66ad229f3f6fe' -o /tmp/vesti.html
          python - <<'PY'
          from pathlib import Path
          import re
          for name, path in [('FZ','/tmp/fz.html'), ('VESTI','/tmp/vesti.html')]:
              text = Path(path).read_text(errors='ignore')
              print(f'--- {name} SIZE ---', len(text))
              scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)
              print(f'--- {name} SCRIPTS ---')
              for x in scripts[:40]: print(x)
              clues = sorted(set(re.findall(r'["\']([^"\']*(?:produto|api|catalogo|carregar|load|page|pagina)[^"\']*)["\']', text, re.I)))
              print(f'--- {name} ENDPOINT CLUES ---')
              for x in clues[:120]: print(x[:300])
              for term in ('Carregar Mais Produtos','fetch(', 'axios', 'ajax', '__NEXT_DATA__', '__NUXT__'):
                  idx = text.lower().find(term.lower())
                  if idx >= 0:
                      print(f'--- {name} CONTEXT {term} ---')
                      print(text[max(0, idx-500):idx+1200].replace('\n',' ')[:1700])
          PY
