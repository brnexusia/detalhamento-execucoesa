name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Vesti server payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' 'https://vesti.co/barracadowillinha/catalogo/5e66ad229f3f6fe' -o /tmp/vesti.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/vesti.html').read_text(errors='ignore')
          print('BYTES',len(t))
          for term in ('\\"skus\\"','\\"prices\\"','\\"products\\"','\\"slug\\"','cdn-op.vesti.mobi/p/'):
              ms=list(re.finditer(re.escape(term),t,re.I))
              print('TERM',term,'COUNT',len(ms))
              for m in ms[:3]: print(t[max(0,m.start()-1000):m.start()+5000][:6000])
          PY
