name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vesti public catalogue API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://apivesti.vesti.mobi/appmarca/v2/catalogue/5e66ad229f3f6fe/company/barracadowillinha/'
          for PAGE in 1 2; do
            URL="${BASE}?page=${PAGE}&perpage=60&with_categories=true&with_colors=true&with_product_colors=true&with_sizes=true&with_brands=true&with_prices=true&with_tags=1"
            curl -fsSL --max-time 20 -A 'Mozilla/5.0' "$URL" -o "/tmp/api-${PAGE}.json"
            python - "$PAGE" <<'PY'
          import json,sys
          from pathlib import Path
          p=sys.argv[1]; data=json.loads(Path('/tmp/api-'+p+'.json').read_text())
          print('PAGE',p,'products',len(data.get('products',[])),'links',data.get('links'),'meta',data.get('meta'))
          if data.get('products'):
            x=data['products'][0]
            print('FIRST_KEYS',sorted(x.keys()))
            keep={k:x.get(k) for k in ('id','code','name','slug','description','price','price_promotional','prices','media','colors','sizes','stocks','skus','category','categories','brand') if k in x}
            print(json.dumps(keep,ensure_ascii=False)[:12000])
          PY
          done
