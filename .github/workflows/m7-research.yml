name: m7-research
on:
  push:
    branches: [scanner-module7-platforms]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-module7-platforms-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Real storefront smoke with variants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { collectCatalog } from './server/scanner-collector.mjs'

          const targets = [
            ['nuvemshop', 'https://tecnoloja14.lojavirtualnuvem.com.br/'],
            ['lojaintegrada', 'https://cn-demo-6.lojaintegrada.com.br/'],
            ['tray', 'https://demo-go-beauty.commercesuite.com.br/'],
            ['vesti', 'https://vesti.co/barracadowillinha/catalogo/5e66ad229f3f6fe'],
          ]

          for (const [expected, url] of targets) {
            const started = Date.now()
            const result = await collectCatalog(url, { maxProducts: 1000, maxPages: 5000, strictPlatformAdapters: true })
            const variantProducts = result.candidates.filter((product) => product.variants?.length)
            const totalVariants = variantProducts.reduce((sum, product) => sum + product.variants.length, 0)
            console.log('REAL_M7', JSON.stringify({
              expected,
              detected: result.platform,
              count: result.candidateCount,
              pages: result.pagesScanned,
              ms: Date.now() - started,
              variantProducts: variantProducts.length,
              totalVariants,
              sample: variantProducts.slice(0, 2).map((product) => ({
                title: product.title,
                sku: product.sku,
                source: product.source,
                images: product.images?.length || 0,
                properties: product.properties,
                variants: product.variants.slice(0, 3),
              })),
            }))
            assert.equal(result.platform, expected)
            assert.ok(result.candidateCount > 0)
            if (expected === 'nuvemshop') {
              assert.equal(result.candidateCount, 36)
              assert.ok(result.pagesScanned < 150)
              assert.ok(totalVariants > 0, 'Nuvemshop sem LS.variants importadas')
            }
            if (expected === 'lojaintegrada') {
              assert.equal(result.candidateCount, 31)
              assert.ok(result.pagesScanned < 150)
              assert.ok(totalVariants > 0, 'Loja Integrada sem grades importadas')
              assert.ok(variantProducts.some((product) => product.variants.some((variant) => variant.sku)), 'Loja Integrada sem SKU de variação')
            }
            if (expected === 'tray') {
              assert.ok(result.candidateCount >= 50)
              assert.ok(totalVariants > 0)
            }
            if (expected === 'vesti') {
              assert.ok(result.candidateCount >= 150)
              assert.ok(totalVariants > 1000)
              assert.ok(variantProducts.some((product) => product.properties?.some((property) => property.name === 'Tamanho')))
            }
          }
          NODE
