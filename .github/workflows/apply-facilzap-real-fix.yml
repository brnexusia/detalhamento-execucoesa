name: apply-facilzap-real-fix
on:
  push:
    branches: [fix-facilzap-images-publish]
    paths:
      - '.github/workflows/apply-facilzap-real-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-facilzap-images-publish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/apply-facilzap-real-fix.py
      - run: npm install
      - run: node server/scanner-module7.test.mjs
      - run: npm run test:scanner:normalizer
      - run: npm run build
      - name: Commit production patch
        run: |
          git config user.name "brnexusia"
          git config user.email "brnexusia@gmail.com"
          git add server/scanner-platforms.mjs server/scanner-collector.mjs server/scanner-module7.test.mjs
          git commit -m "Scanner: corrigir imagens e grades reais do FácilZap"
          git push origin HEAD:fix-facilzap-images-publish
