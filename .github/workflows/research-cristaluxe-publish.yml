name: research-cristaluxe-publish
on:
  push:
    branches: [fix-import-publish-cristaluxe]
    paths:
      - '.github/workflows/research-cristaluxe-publish.yml'
      - 'server/research-cristaluxe-publish.integration.mjs'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atacado
          POSTGRES_PASSWORD: atacado
          POSTGRES_DB: atacado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atacado -d atacado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atacado:atacado@127.0.0.1:5432/atacado_test
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      SCANNER_WORKER_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-import-publish-cristaluxe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: |
          npm start > /tmp/atacado-shop.log 2>&1 &
          echo $! > /tmp/atacado-shop.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health && break || sleep 1; done
      - run: node server/research-cristaluxe-publish.integration.mjs
      - if: failure()
        run: cat /tmp/atacado-shop.log || true
