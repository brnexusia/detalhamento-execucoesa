name: Validate product categories
on:
  push:
    branches: [main]
    paths:
      - 'server/product-category-schema.mjs'
      - 'src/product-category-utils.ts'
      - 'tests/product-category-schema.test.mjs'
      - '.github/workflows/validate-product-categories.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/product-category-schema.mjs'
      - 'src/product-category-utils.ts'
      - 'tests/product-category-schema.test.mjs'
      - '.github/workflows/validate-product-categories.yml'
jobs:
  category-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopvax
          POSTGRES_PASSWORD: shopvax
          POSTGRES_DB: category_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U shopvax -d category_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shopvax:shopvax@127.0.0.1:5432/category_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types tests/product-category-schema.test.mjs
