name: stripe-payment-gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  payment-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopvax
          POSTGRES_PASSWORD: shopvax
          POSTGRES_DB: payment_gate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopvax -d payment_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://shopvax:shopvax@127.0.0.1:5432/payment_gate
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      SCANNER_WORKER_DISABLED: '1'
      SHOPVAX_SECURITY_RATE_LIMIT_DISABLED: '1'
      NODE_ENV: production
      # Propositalmente SEM credenciais Stripe: não pode conceder acesso grátis.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start backend without Stripe credentials
        run: |
          npm start > /tmp/shopvax-payment-gate.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:3000/health > /dev/null && exit 0
            sleep .25
          done
          cat /tmp/shopvax-payment-gate.log
          exit 1
      - name: Assert that checkout is mandatory and panel/order APIs remain blocked
        run: node server/stripe-payment-gate.integration.mjs
      - name: Debug server startup
        if: failure()
        run: cat /tmp/shopvax-payment-gate.log || true
