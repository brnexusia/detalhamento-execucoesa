name: ShopVax - Catalog visual regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PublicStoreV2.tsx'
      - 'src/shopvax-commerce.css'
      - 'src/shopvax-ui-refinement.css'
      - 'tests/shopvax-catalog-visual-20261113.e2e.mjs'
      - '.github/workflows/shopvax-catalog-visual.yml'
  push:
    branches: [main]
    paths:
      - 'src/PublicStoreV2.tsx'
      - 'src/shopvax-commerce.css'
      - 'src/shopvax-ui-refinement.css'
      - 'tests/shopvax-catalog-visual-20261113.e2e.mjs'
      - '.github/workflows/shopvax-catalog-visual.yml'
permissions:
  contents: read
jobs:
  catalog-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm install --no-save --no-fund --no-audit playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Servir build compilado
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/shopvax-preview.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
      - name: Verificar busca, fotos dos destaques, filtros e responsividade
        run: node tests/shopvax-catalog-visual-20261113.e2e.mjs
