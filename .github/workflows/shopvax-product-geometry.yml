name: ShopVax - Product detail geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PublicStoreV2.tsx'
      - 'src/shopvax-desktop-product-page.css'
      - 'tests/shopvax-product-geometry-20261113.e2e.mjs'
      - '.github/workflows/shopvax-product-geometry.yml'
  push:
    branches: [main]
    paths:
      - 'src/PublicStoreV2.tsx'
      - 'src/shopvax-desktop-product-page.css'
      - 'tests/shopvax-product-geometry-20261113.e2e.mjs'
      - '.github/workflows/shopvax-product-geometry.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm install --no-save --no-fund --no-audit playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Servir o build do frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/shopvax-preview.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
      - name: Grade, margens, uma foto e relacionamento sem sobreposição
        run: node tests/shopvax-product-geometry-20261113.e2e.mjs
      - name: Evitar regressões do produto completo
        run: node tests/shopvax-desktop-product-05.e2e.mjs
