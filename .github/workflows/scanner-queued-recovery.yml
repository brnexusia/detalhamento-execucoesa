name: Scanner queued 0% recovery
on:
  pull_request:
    paths:
      - 'server/scanner-hooks.mjs'
      - 'server/scanner-work-scheduler.mjs'
      - 'server/scanner-work-scheduler.test.mjs'
      - 'server/scanner-queue-lanes.mjs'
      - 'server/scanner-queue-lanes.test.mjs'
      - 'src/api.ts'
      - 'src/ScannerModule1.tsx'
      - '.github/workflows/scanner-queued-recovery.yml'
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner_test
          POSTGRES_DB: scanner_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U scanner -d scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scanner:scanner_test@127.0.0.1:5432/scanner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Verify PostgreSQL queued jobs and dedicated lanes
        run: node --test server/scanner-queue-lanes.test.mjs server/scanner-work-scheduler.test.mjs server/scanner-scan-lease.test.mjs
      - name: Verify Google Photos collector and unchanged OCR
        run: node server/scanner-photo-albums.test.mjs
      - name: Verify merchant panel builds with queue diagnostics
        run: npm run build
