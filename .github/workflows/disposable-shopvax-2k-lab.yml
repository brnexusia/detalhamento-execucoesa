name: TEMP disposable shopvax 2000-VU laboratory
on:
  push:
    branches: [lab/disposable-k6-2k-shopvax-20261115]
    paths:
      - 'scripts/disposable-k6-*'
      - '.github/workflows/disposable-shopvax-2k-lab.yml'
permissions:
  contents: read
jobs:
  disposable-load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopvax
          POSTGRES_PASSWORD: shopvax
          POSTGRES_DB: atacado_perf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopvax -d atacado_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shopvax:shopvax@127.0.0.1:5432/atacado_perf
      BASE_URL: http://127.0.0.1:3000
      PORT: 3000
      SHOPVAX_PERF_LOCAL_ONLY: '1'
      SHOPVAX_TEST_BILLING_BYPASS: '1'
      SCANNER_WORKER_DISABLED: '1'
      SHOPVAX_MEDIA_WORKER_DISABLED: '1'
      SHOPVAX_IMPORT_MEDIA_REPAIR_DISABLED: '1'
      SHOPVAX_SECURITY_RATE_LIMIT_DISABLED: '1'
      SHOPVAX_PUBLIC_CATALOG_RATE_LIMIT_DISABLED: '1' # 2k VUs share one CI IP; benchmark, NOT production
      SHOPVAX_PLAN_LIMITS_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start API against temporary database (never production)
        run: |
          npm start > /tmp/shopvax-k6-api.log 2>&1 &
          echo $! > /tmp/shopvax-k6-api.pid
          for i in $(seq 1 90); do
            if curl --max-time 2 -fsS http://127.0.0.1:3000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/shopvax-k6-api.log
          exit 1
      - name: Seed 20 actual merchant sessions, 3000 products and 1000 existing orders
        run: node scripts/disposable-k6-fixtures.mjs
      - name: Run one thousand virtual buyers with merchant, order and import bursts
        id: wave1
        continue-on-error: true
        run: |
          docker run --rm --network host --cpus=2 --memory=5g \
            -v "$PWD/scripts/disposable-k6-load.js:/scripts/test.js:ro" \
            -v "/tmp:/tmp:rw" \
            -e BASE_URL -e SHOPVAX_PERF_LOCAL_ONLY -e BUYER_VUS=1000 \
            grafana/k6:0.54.0 run /scripts/test.js --no-color --quiet
      - name: Snapshot resource consumption after first wave
        if: always()
        run: |
          ps -eo pid,comm,rss,%cpu --sort=-rss | head -12 | tee /tmp/shopvax-k6-resource-1.txt
          docker stats --no-stream || true
      - name: Run two thousand virtual buyers with concurrent merchant and write workloads
        id: wave2
        continue-on-error: true
        run: |
          docker run --rm --network host --cpus=2 --memory=5g \
            -v "$PWD/scripts/disposable-k6-load.js:/scripts/test.js:ro" \
            -v "/tmp:/tmp:rw" \
            -e BASE_URL -e SHOPVAX_PERF_LOCAL_ONLY -e BUYER_VUS=2000 \
            grafana/k6:0.54.0 run /scripts/test.js --no-color --quiet
      - name: Record database and runtime state after load
        if: always()
        run: |
          ps -eo pid,comm,rss,%cpu --sort=-rss | head -12 | tee /tmp/shopvax-k6-resource-2.txt
          curl --max-time 8 -sS http://127.0.0.1:3000/health > /tmp/shopvax-k6-health.json || true
          node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); for(const t of ['orders','import_jobs','events']){const n=await c.query('SELECT count(*)::int AS n FROM '+t);console.log('K6_POST_LOAD '+t+' '+n.rows[0].n)} await c.end()" || true
      - name: Export reports only (server, DB and containers die with runner)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-shopvax-2k-report
          path: |
            /tmp/shopvax-k6-1000.json
            /tmp/shopvax-k6-2000.json
            /tmp/shopvax-k6-health.json
            /tmp/shopvax-k6-resource-1.txt
            /tmp/shopvax-k6-resource-2.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Stop temporary API
        if: always()
        run: |
          if [ -f /tmp/shopvax-k6-api.pid ]; then kill $(cat /tmp/shopvax-k6-api.pid) || true; fi
