name: ShopVax - Store owner recognition
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/CustomerAccountLauncher.tsx'
      - 'tests/shopvax-store-owner-launcher.e2e.mjs'
      - '.github/workflows/shopvax-owner-store-login.yml'
  push:
    branches: [main]
    paths:
      - 'src/CustomerAccountLauncher.tsx'
      - 'tests/shopvax-store-owner-launcher.e2e.mjs'
      - '.github/workflows/shopvax-owner-store-login.yml'
permissions:
  contents: read
jobs:
  owner-login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm install --no-save --no-fund --no-audit playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Servir a interface compilada
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/shopvax-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
      - name: Validar reconhecimento do lojista na própria loja
        run: node tests/shopvax-store-owner-launcher.e2e.mjs
