name: evaluate-alternate-rapidocr-on-mama-failures
on:
  push:
    branches: [audit/mama-full-21-albums-20261117]
    paths:
      - scripts/mama-rapidocr-download.mjs
      - scripts/mama-rapidocr-evaluate.py
      - .github/workflows/mama-rapidocr-evaluate.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: python -m pip install --quiet rapidocr onnxruntime
      - run: node scripts/mama-rapidocr-download.mjs
      - run: python -u scripts/mama-rapidocr-evaluate.py
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
