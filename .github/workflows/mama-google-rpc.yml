name: diagnose-google-photos-public-pagination-rpc
on:
  push:
    branches: [audit/mama-full-21-albums-20261117]
    paths:
      - scripts/mama-google-rpc.mjs
      - .github/workflows/mama-google-rpc.yml
permissions:
  contents: read
jobs:
  rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --no-audit --no-fund playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/mama-google-rpc.mjs
