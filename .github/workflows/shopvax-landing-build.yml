name: shopvax-landing-native

on:
  pull_request:
    branches: [main]
    paths:
      - 'vendor/screenshot-to-spark-0332/**'
      - 'landing-integration/**'
      - 'src/HomeRoute.tsx'
      - 'server/app.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - 'server/shopvax-landing-regression.test.mjs'
      - '.github/workflows/shopvax-landing-build.yml'
  workflow_dispatch:

jobs:
  landing-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify byte-for-byte fidelity and route
        run: npm run test:landing
      - name: Production TypeScript/Vite + native LP build
        run: npm run build
      - name: Check native LP build artifacts
        run: |
          test -s dist/para-lojas/index.html
          test -f dist/para-lojas/favicon.png
          grep -q '/para-lojas/assets/' dist/para-lojas/index.html
          test -z "$(find dist/para-lojas/assets -name '*.js' -size 0)"
          test -z "$(find dist/para-lojas/assets -name '*.css' -size 0)"
