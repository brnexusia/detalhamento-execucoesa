name: braavo-live-inspect

on:
  push:
    branches: [fix/braavo-variant-image-galleries]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live product
        run: |
          curl -L --fail --silent --show-error 'https://www.swmoda.com.br/p/blusamangacurtadecotevfrenteecostaslisa' -o /tmp/product.html
          wc -c /tmp/product.html
      - name: Print relevant HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          import re

          html=open('/tmp/product.html','r',encoding='utf-8',errors='ignore').read()
          print('thumb count', html.count('thumb.braavo.me'))
          print('static count', html.count('static1.braavo.com.br'))

          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  blob=' '.join([tag]+[f'{k}={v}' for k,v in attrs if v])
                  if tag=='img':
                      src=d.get('src') or d.get('data-src') or d.get('data-lazy-src') or ''
                      alt=d.get('alt','')
                      if 'braavo' in src or alt:
                          print('IMG', {k:v for k,v in d.items() if k in ('src','data-src','data-lazy-src','data-original','data-zoom-image','data-large-image','data-full','data-full-image','alt','class','id') or k.startswith('data-')})
                  if re.search(r'(vari|cor|color|galer|foto|image|sku|produto)', blob, re.I):
                      print('TAG', tag, attrs)
          P().feed(html)
          PY
