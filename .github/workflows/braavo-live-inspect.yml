name: braavo-live-inspect

on:
  push:
    branches: [fix/braavo-variant-image-galleries]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Scanner collector tests
        run: npm run test:scanner:collector
      - name: Scanner normalizer tests
        run: npm run test:scanner:normalizer
      - name: Scanner review tests
        run: npm run test:scanner:review
      - name: Imported media localization tests
        run: node server/import-media-localizer.test.mjs
      - name: Build
        run: npm run build
      - name: Validate live Braavo galleries
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { extractProductsFromHtml, safeRequest } from './server/scanner-collector.mjs'
          import { normalizeCandidate } from './server/scanner-normalizer.mjs'

          const url = 'https://www.swmoda.com.br/p/blusamangacurtadecotevfrenteecostaslisa'
          const response = await safeRequest(url)
          assert.equal(response.ok, true)
          const candidate = extractProductsFromHtml(response.body, response.url)[0]
          assert.ok(candidate)
          assert.equal(candidate.source, 'braavo-html')

          const galleryVariants = candidate.variants.filter((item) => Array.isArray(item.images) && item.images.length)
          const gallerySummary = galleryVariants.map((item) => ({ color: item.color, images: item.images.length }))
          const totalVariantImages = galleryVariants.reduce((sum, item) => sum + item.images.length, 0)
          console.log('base images', candidate.images.length)
          console.log('gallery variants', JSON.stringify(gallerySummary))
          console.log('total variant images', totalVariantImages)
          console.log('sku variants', candidate.variants.filter((item) => item.size).length)

          assert.ok(galleryVariants.length >= 7, 'deve captar as galerias de todas as cores publicadas')
          assert.ok(totalVariantImages >= 20, 'deve captar múltiplas fotos por cor')
          assert.ok(candidate.variants.some((item) => item.color === 'Off White' && item.images?.length >= 5))
          assert.ok(candidate.variants.some((item) => item.color === 'Grena' && item.images?.length >= 4))

          const normalized = normalizeCandidate(candidate).normalized
          console.log('normalized groups', JSON.stringify(normalized.variant_images.map((group) => ({ selections: group.selections, images: group.images.length }))))
          assert.ok(normalized.variant_images.length >= 7)
          assert.ok(normalized.variant_images.every((group) => Object.keys(group.selections).length === 1 && group.selections.Cor))
          assert.ok(normalized.variant_images.some((group) => group.selections.Cor === 'Off White' && group.images.length >= 5))
          NODE
