name: scanner-catalog-platform-diagnostics
on:
  push:
    branches: [feat/full-catalog-facilzap-gopage-vesti-diz-20261107]
    paths:
      - 'scripts/diagnose-catalog-platforms-20261107.mjs'
      - '.github/workflows/scanner-catalog-platform-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect public HTML and pagination signatures
        run: node scripts/diagnose-catalog-platforms-20261107.mjs
