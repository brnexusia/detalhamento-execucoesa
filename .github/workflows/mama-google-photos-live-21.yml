name: mama-google-photos-live-21
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-mama-public-albums-live.mjs'
      - 'scripts/mama-public-album-links.mjs'
      - '.github/workflows/mama-google-photos-live-21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-albums:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OCR and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por tesseract-ocr-eng util-linux
          npm install --no-audit --no-fund --package-lock=false
      - name: Validate all 21 public links and real photo OCR samples
        run: node scripts/test-mama-public-albums-live.mjs
      - name: Save per-album evidence even on errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mama-google-photos-live-report
          path: reports/mama-google-photos-live-smoke.json
          if-no-files-found: warn
