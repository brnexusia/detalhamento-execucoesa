name: ShopVax - Safari mobile produção

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shopvax-safari-mobile.yml'
      - 'scripts/build-ui-version.mjs'
      - 'tests/shopvax-safari-mobile-live.mjs'
      - 'tests/shopvax-feedback-ui.e2e.mjs'
      - 'src/**/*.css'
      - 'src/**/*.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar WebKit Safari
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: Compilar interface mobile
        run: npm run build
      - name: Iniciar frontend da versão main
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/shopvax-safari-vite.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/shopvax-safari-vite.log
          exit 1
      - name: Validar a main renderizada no WebKit
        env:
          SHOPVAX_TEST_BROWSER: webkit
        run: node tests/shopvax-feedback-ui.e2e.mjs

      - name: Aguardar a mesma revisão da main em produção
        shell: bash
        run: |
          expected_revision="$(node -p "JSON.parse(require('node:fs').readFileSync('public/shopvax-ui-version.json','utf8')).revision")"
          expected_fingerprint="$(node -p "JSON.parse(require('node:fs').readFileSync('public/shopvax-ui-version.json','utf8')).sourceFingerprint")"
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS --max-time 12 https://shopvax.com.br/shopvax-ui-version.json || true)"
            actual_revision="$(PAYLOAD="$payload" node -e "try{process.stdout.write(JSON.parse(process.env.PAYLOAD).revision||'')}catch{}")"
            actual_fingerprint="$(PAYLOAD="$payload" node -e "try{process.stdout.write(JSON.parse(process.env.PAYLOAD).sourceFingerprint||'')}catch{}")"
            if [[ "$actual_revision" == "$expected_revision" && "$actual_fingerprint" == "$expected_fingerprint" ]]; then
              echo "Produção está na revisão esperada: $actual_revision / $actual_fingerprint"
              exit 0
            fi
            echo "Tentativa $attempt/30: produção ainda está em ${actual_revision:-indisponível} / ${actual_fingerprint:-indisponível}; esperado $expected_revision / $expected_fingerprint"
            sleep 20
          done
          echo "A produção não publicou a revisão da main dentro de 10 minutos."
          exit 1

      - name: Homologar produção mobile no Safari/WebKit
        run: node tests/shopvax-safari-mobile-live.mjs
      - name: Evidências WebKit na main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopvax-main-webkit-screenshots
          path: artifacts/shopvax-feedback/

      - name: Evidências Safari Mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopvax-safari-mobile-screenshots
          path: artifacts/shopvax-safari-mobile/
