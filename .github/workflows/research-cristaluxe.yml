name: research-cristaluxe
on:
  push:
    branches: [scanner-complete-custom-sites]
    paths:
      - '.github/workflows/research-cristaluxe.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scanner-complete-custom-sites
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node .github/scripts/research-cristaluxe.mjs
