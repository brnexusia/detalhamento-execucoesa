name: research-facilzap-live
on:
  push:
    branches: [fix-facilzap-images-publish]
    paths:
      - '.github/workflows/research-facilzap-live.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-facilzap-images-publish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node .github/scripts/research-facilzap-live.mjs
