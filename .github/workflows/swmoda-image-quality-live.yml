name: swmoda-image-quality-live

on:
  push:
    branches: [inspect/swmoda-image-quality-live]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Compare SW Moda image variants with Shopvax
        shell: bash
        run: |
          set -euo pipefail
          SHOP="https://shopvax.com.br/media/0cd825ba-8b56-46d5-bdf1-d38d844957d5"
          BASE="https://thumb.braavo.me/slave"
          ID="968285696.webp"
          for spec in "shop:$SHOP" "source0:$BASE/0/$ID" "source600:$BASE/600/$ID" "source1000:$BASE/1000/$ID" "source200:$BASE/200/$ID"; do
            label="${spec%%:*}"
            url="${spec#*:}"
            curl -fsSL --retry 3 -A "Mozilla/5.0" "$url" -o "/tmp/$label"
            echo "${label}_URL=$url"
            echo "${label}_BYTES=$(wc -c < "/tmp/$label")"
            echo "${label}_SHA256=$(sha256sum "/tmp/$label" | cut -d' ' -f1)"
          done
          node --input-type=module <<'NODE'
          import sharp from 'sharp'
          for (const label of ['shop','source0','source600','source1000','source200']) {
            const meta=await sharp('/tmp/'+label).metadata()
            console.log(label.toUpperCase()+'_META', JSON.stringify({format:meta.format,width:meta.width,height:meta.height,space:meta.space,channels:meta.channels}))
          }
          NODE
