name: swmoda-image-quality-live

on:
  push:
    branches: [inspect/swmoda-image-quality-live]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Compare representative Shopvax images with SW Moda srcset
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cases.tsv <<'EOF'
          Blusa Liegi em Fluity|https://www.swmoda.com.br/p/blusaliegi|https://shopvax.com.br/media/0cd825ba-8b56-46d5-bdf1-d38d844957d5
          Blusa Manga Quadrada Estampada|https://www.swmoda.com.br/p/blusamangaquadradaestampada|https://shopvax.com.br/media/c15f2642-9a98-4032-a870-57f08b81f06f
          Macacão Street com Bolsos Estampado|https://www.swmoda.com.br/p/macacaostreetcombolsosestampado|https://shopvax.com.br/media/ebe1ab0e-e766-4512-a07a-f5358bbce544
          EOF
          while IFS='|' read -r NAME PRODUCT SHOP; do
            echo "=== $NAME ==="
            curl -fsSL --retry 3 -A "Mozilla/5.0" "$PRODUCT" -o /tmp/product.html
            ID="$(python3 - <<'PY'
          import re,html
          s=open('/tmp/product.html',encoding='utf-8',errors='ignore').read()
          vals=re.findall(r'data-src=["\']https://thumb\.braavo\.me/slave/0/([^"\']+)["\']',s,re.I)
          print(html.unescape(vals[0]) if vals else '')
          PY
            )"
            test -n "$ID"
            for spec in "shop:$SHOP" "zero:https://thumb.braavo.me/slave/0/$ID" "w600:https://thumb.braavo.me/slave/600/$ID" "w1000:https://thumb.braavo.me/slave/1000/$ID"; do
              label="${spec%%:*}"
              url="${spec#*:}"
              curl -fsSL --retry 3 -A "Mozilla/5.0" "$url" -o "/tmp/$label"
            done
            NAME="$NAME" node --input-type=module <<'NODE'
          import sharp from 'sharp'
          import { createHash } from 'crypto'
          import { readFile } from 'fs/promises'
          const out={name:process.env.NAME}
          for (const label of ['shop','zero','w600','w1000']) {
            const buf=await readFile('/tmp/'+label)
            const meta=await sharp(buf).metadata()
            out[label]={bytes:buf.length,sha256:createHash('sha256').update(buf).digest('hex'),width:meta.width,height:meta.height,format:meta.format}
          }
          console.log(JSON.stringify(out))
          NODE
          done < /tmp/cases.tsv
