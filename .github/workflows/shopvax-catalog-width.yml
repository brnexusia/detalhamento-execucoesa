name: ShopVax - Catalog cards responsive regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/catalog-manager.css'
      - 'tests/shopvax-catalog-width.e2e.mjs'
      - '.github/workflows/shopvax-catalog-width.yml'
  push:
    branches: [main]
    paths:
      - 'src/catalog-manager.css'
      - 'tests/shopvax-catalog-width.e2e.mjs'
      - '.github/workflows/shopvax-catalog-width.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm install --no-save --no-fund --no-audit playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Verificar bordas dos catálogos no desktop e no celular
        run: node tests/shopvax-catalog-width.e2e.mjs
