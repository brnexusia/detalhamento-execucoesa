name: diagnostic MAMA extra tight crop stickers
on:
  push:
    branches: [audit/mama-all-photos-ocr-20261116]
    paths:
      - 'scripts/temp-mama-tight-crops.mjs'
      - '.github/workflows/temp-mama-tight-crops.yml'
permissions:
  contents: read
jobs:
  tight:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      matrix:
        group: [0, 1]
    env:
      MAMA_TIGHT_GROUP: ${{ matrix.group }}
      OMP_THREAD_LIMIT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por tesseract-ocr-eng util-linux
      - run: npm install --no-audit --no-fund
      - run: node scripts/temp-mama-tight-crops.mjs
