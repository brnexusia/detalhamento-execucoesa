name: facilzap-live-e2e
on:
  push:
    branches: [fix-facilzap-images-publish]
    paths:
      - '.github/workflows/facilzap-live-e2e.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atacado
          POSTGRES_PASSWORD: atacado
          POSTGRES_DB: atacado_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atacado -d atacado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atacado:atacado@127.0.0.1:5432/atacado_test
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      SCANNER_WORKER_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-facilzap-images-publish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Start app
        run: |
          npm start >/tmp/atacado.log 2>&1 &
          sleep 2
      - run: node .github/scripts/facilzap-live-e2e.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/atacado.log || true
