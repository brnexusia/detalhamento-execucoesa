name: pdf-upload-and-real-paddle-e2e
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/scanner-pdf-chunks.mjs'
      - 'server/scanner-pdf-chunks.integration.test.mjs'
      - 'server/scanner-hooks.mjs'
      - 'server/paddle-ocr.real.integration.test.mjs'
      - 'server/scanner-pdf-paddle.mjs'
      - 'server/scanner-pdf.mjs'
      - 'server/paddle-ocr-service.py'
      - 'src/api.ts'
      - 'src/ScannerModule1.tsx'
      - '.github/workflows/pdf-upload-and-real-paddle-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'server/scanner-pdf-chunks.mjs'
      - 'server/scanner-pdf-chunks.integration.test.mjs'
      - 'server/scanner-hooks.mjs'
      - 'server/paddle-ocr.real.integration.test.mjs'
      - 'server/scanner-pdf-paddle.mjs'
      - 'server/scanner-pdf.mjs'
      - 'server/paddle-ocr-service.py'
      - 'src/api.ts'
      - 'src/ScannerModule1.tsx'
jobs:
  upload-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopvax_chunks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopvax_chunks"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend and backend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate upload implementation
        run: |
          node --check server/scanner-pdf-chunks.mjs
          node --check server/scanner-hooks.mjs
          node --test server/scanner-pdf-chunks.integration.test.mjs
        env:
          PDF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shopvax_chunks
      - name: Verify frontend builds with resumable PDF upload
        run: npm run build
  paddle-real:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build actual Atacado Shop Docker image with PaddleOCR
        run: docker build -f Dockerfile -t atacado-paddle-real .
      - name: Start genuine CPU OCR using bundled models
        run: |
          docker run -d --name paddle-real --entrypoint /opt/paddleocr/bin/python atacado-paddle-real -u /app/server/paddle-ocr-service.py
          for i in $(seq 1 100); do
            if docker exec paddle-real node -e "fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo 'PaddleOCR service healthy'
              exit 0
            fi
            sleep 2
          done
          docker logs paddle-real
          exit 1
      - name: End-to-end real PaddleOCR inference and two-product PDF extraction
        run: docker exec -e PDF_OCR_REAL_TEST=1 paddle-real node --test server/paddle-ocr.real.integration.test.mjs
      - name: Print runtime logs if test fails
        if: failure()
        run: docker logs --tail 120 paddle-real || true
      - name: Stop test container
        if: always()
        run: docker rm -f paddle-real || true
