name: pdf-upload-and-layout-e2e
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/scanner-pdf-chunks.mjs'
      - 'server/scanner-pdf-chunks.integration.test.mjs'
      - 'server/scanner-hooks.mjs'
      - 'server/app.mjs'
      - 'server/upload-request-logging.mjs'
      - 'server/upload-request-logging.test.mjs'
      - 'scripts/start-with-paddle-ocr.sh'
      - 'server/scanner-pdf-visual-association.test.mjs'
      - 'server/scanner-pdf-visual.integration.test.mjs'
      - 'server/scanner-pdf-visual-association.mjs'
      - 'server/scanner-pdf-tesseract.mjs'

      - 'server/scanner-pdf.mjs'

      - 'src/api.ts'
      - 'src/ScannerModule1.tsx'
      - '.github/workflows/pdf-upload-and-real-paddle-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'server/scanner-pdf-chunks.mjs'
      - 'server/scanner-pdf-chunks.integration.test.mjs'
      - 'server/scanner-hooks.mjs'
      - 'server/app.mjs'
      - 'server/upload-request-logging.mjs'
      - 'server/upload-request-logging.test.mjs'
      - 'scripts/start-with-paddle-ocr.sh'
      - 'server/paddle-ocr.real.integration.test.mjs'
      - 'server/scanner-pdf-paddle.mjs'
      - 'server/scanner-pdf.mjs'
      - 'server/paddle-ocr-service.py'
      - 'src/api.ts'
      - 'src/ScannerModule1.tsx'
jobs:
  upload-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopvax_chunks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopvax_chunks"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend and backend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate upload implementation
        run: |
          node --check server/scanner-pdf-chunks.mjs
          node --check server/scanner-hooks.mjs
          node --check server/app.mjs
          sh -n scripts/start-with-paddle-ocr.sh
          node --test server/upload-request-logging.test.mjs server/scanner-pdf-chunks.integration.test.mjs
        env:
          PDF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shopvax_chunks
      - name: Verify frontend builds with resumable PDF upload
        run: npm run build
  layout-tesseract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tesseract and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng util-linux
          npm install --no-audit --no-fund
      - name: Validate entire PDF scanner with positioned photos and prices
        run: npm run test:scanner:pdf
      - name: Validate frontend compilation
        run: npm run build
