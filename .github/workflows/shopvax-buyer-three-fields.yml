name: ShopVax - Cadastro comprador 3 campos
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BuyerWhatsappLogin.tsx'
      - 'src/GlobalBuyerAccount.tsx'
      - 'server/buyer-document.mjs'
      - 'server/buyer-document.test.mjs'
      - 'server/buyer-whatsapp-auth-hooks.mjs'
      - 'server/buyer-whatsapp-auth.test.mjs'
      - 'public/politica-de-privacidade.html'
      - 'public/termos-de-uso.html'
      - 'tests/shopvax-buyer-three-fields.e2e.mjs'
      - '.github/workflows/shopvax-buyer-three-fields.yml'
  push:
    branches: [main]
    paths:
      - 'src/BuyerWhatsappLogin.tsx'
      - 'server/buyer-document.mjs'
      - 'server/buyer-whatsapp-auth-hooks.mjs'
      - 'tests/shopvax-buyer-three-fields.e2e.mjs'
permissions:
  contents: read
jobs:
  validate-buyer-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: node --test server/buyer-document.test.mjs server/buyer-whatsapp-auth.test.mjs
      - run: npm run build
      - run: npm install --no-save --no-fund --no-audit playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Servir frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/shopvax-preview.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
      - name: Cadastro WhatsApp + CPF/CNPJ em mobile e desktop
        run: node tests/shopvax-buyer-three-fields.e2e.mjs
