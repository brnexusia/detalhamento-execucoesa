name: validate-imported-product-price-ui
on:
  push:
    branches: [main]
    paths:
      - 'src/AdminApp.tsx'
      - 'src/CatalogManager.tsx'
      - 'src/public-share-links.ts'
      - 'src/catalog-manager.css'
      - 'src/api.ts'
      - 'server/page-metadata-hooks.mjs'
      - 'tests/shopvax-product-catalog-ui.e2e.mjs'
      - 'tests/shopvax-pretty-catalog-links.e2e.mjs'
      - 'src/ProductCategoryPicker.tsx'
      - 'src/product-category-picker.css'
      - 'tests/shopvax-imported-product-price.e2e.mjs'
      - '.github/workflows/validate-imported-product-price-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/AdminApp.tsx'
      - 'src/CatalogManager.tsx'
      - 'src/public-share-links.ts'
      - 'src/catalog-manager.css'
      - 'src/api.ts'
      - 'server/page-metadata-hooks.mjs'
      - 'tests/shopvax-product-catalog-ui.e2e.mjs'
      - 'tests/shopvax-pretty-catalog-links.e2e.mjs'
      - 'src/ProductPriceEditor.tsx'
      - 'src/ProductCategoryPicker.tsx'
      - 'src/product-category-utils.ts'
      - 'src/product-category-picker.css'
      - 'src/product-price-editor.css'
      - 'src/PublicStoreV2.tsx'
      - 'src/variant-pricing.ts'
      - 'tests/shopvax-imported-product-price.e2e.mjs'
      - 'tests/shopvax-grade.e2e.mjs'
      - '.github/workflows/validate-imported-product-price-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --no-audit --no-fund playwright@1.58.2
      - run: npm run build
      - name: Start isolated web interface
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/shopvax-ui-test.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -120 /tmp/shopvax-ui-test.log
          exit 1
      - name: Validate pricing editor, legacy catalog prices, and mobile layout
        run: node tests/shopvax-imported-product-price.e2e.mjs
      - name: Validate buyer selection and grade prices
        run: node tests/shopvax-grade.e2e.mjs
      - name: Validate pretty catalog links and folder sharing
        run: node tests/shopvax-pretty-catalog-links.e2e.mjs && node tests/shopvax-product-catalog-ui.e2e.mjs
      - if: failure()
        run: tail -150 /tmp/shopvax-ui-test.log || true
